<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Backlog Preventa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EEE6;
    --paper-2:#E8E4D8;
    --ink:#22261F;
    --ink-soft:#5A5F52;
    --ink-faint:#8B8F80;
    --line:#D3CDBC;
    --line-strong:#B7AF97;
    --stamp:#6FA3C7;
    --stamp-dark:#2E5C73;
    --stamp-bg:#DCEBF1;
    --mustard:#B5822B;
    --mustard-bg:#F1E4C6;
    --green:#3E7D4C;
    --green-bg:#DCEBDD;
    --amber:#B5822B;
    --amber-bg:#F1E4C6;
    --red:#B23F35;
    --red-bg:#F3DCD8;
    --shadow: 0 1px 2px rgba(34,38,31,0.06), 0 4px 14px rgba(34,38,31,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1320px;margin:0 auto;padding:28px 32px 80px;}
  h1,h2,h3{font-family:'Montserrat',sans-serif;font-weight:600;margin:0;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .topbar h1{font-size:28px;letter-spacing:-0.01em;}
  .topbar .sub{font-size:13px;color:var(--ink-soft);margin-top:2px;font-family:'IBM Plex Mono',monospace;}
  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    border-radius:3px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    color:var(--ink);
    padding:8px 14px;
    cursor:pointer;
    transition:background .12s, transform .05s;
  }
  button:hover{background:var(--paper-2);}
  button:active{transform:scale(0.98);}
  button.primary{background:var(--stamp);border-color:var(--stamp-dark);color:#F4F7F5;}
  button.primary:hover{background:var(--stamp-dark);}
  button.danger{border-color:var(--red);color:var(--red);}
  button.danger:hover{background:var(--red-bg);}
  button.ghost{border-color:transparent;background:transparent;}
  button.ghost:hover{background:var(--paper-2);}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .kpi{
    background:#FBFAF6;
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 16px;
    position:relative;
  }
  .kpi::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--stamp);border-radius:3px 0 0 3px;
  }
  .kpi.warn::before{background:var(--amber);}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px;}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:500;color:var(--ink);}
  .filters{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:16px;padding:12px 14px;background:#FBFAF6;
    border:1px solid var(--line);border-radius:4px;
  }
  .filters label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-right:4px;}
  select,input[type=text],input[type=search],input[type=number],input[type=date],textarea{
    font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);
    background:#FFFFFB;border:1px solid var(--line-strong);border-radius:3px;
    padding:7px 9px;
  }
  select:focus,input:focus,textarea:focus{outline:2px solid var(--stamp-bg);border-color:var(--stamp);}
  .filters select, .filters input{min-width:150px;}
  .spacer{flex:1;}
  .table-wrap{
    background:#FBFAF6;border:1px solid var(--line);border-radius:4px;overflow-x:auto;
    width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;
    padding:0 32px;box-sizing:border-box;
  }
  .table-wrap table{margin:0 auto;}
  @media (max-width:720px){
    .table-wrap{padding:0 14px;}
  }
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-soft);font-weight:500;padding:10px 12px;
    border-bottom:1px solid var(--line-strong);background:var(--paper-2);
    white-space:nowrap;
  }
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--stamp-bg);}
  .idcell{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .cliente-cell{font-weight:500;}
  .cliente-cell .cuit{display:block;font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;font-weight:400;}
  .seg-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;background:var(--stamp-bg);color:var(--stamp-dark);white-space:nowrap;}
  .etapa-track{display:flex;gap:3px;align-items:center;}
  .etapa-track .dot{width:14px;height:5px;border-radius:2px;background:var(--line-strong);}
  .etapa-track .dot.done{background:var(--stamp);}
  .etapa-label{font-size:11px;color:var(--ink-soft);margin-left:6px;white-space:nowrap;}
  .money{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .semaforo{display:inline-flex;align-items:center;gap:6px;}
  .semaforo .dot{width:9px;height:9px;border-radius:50%;}
  .dot-verde{background:var(--green);}
  .dot-amarillo{background:var(--amber);}
  .dot-rojo{background:var(--red);}
  .dot-gris{background:var(--ink-faint);}
  .dias-restantes{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .bant-cell{text-align:center;width:30px;font-size:13px;}
  th.bant-th{text-align:center;width:30px;padding-left:4px;padding-right:4px;}
  .estprop-cell{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{margin-bottom:8px;color:var(--ink);}
  .empty-state p{font-size:13px;margin:0 0 16px;}
  .overlay{
    position:fixed;inset:0;background:rgba(34,38,31,0.35);
    display:none;align-items:stretch;justify-content:flex-end;z-index:50;
  }
  .overlay.open{display:flex;}
  .drawer{
    width:min(560px,92vw);background:var(--paper);height:100%;overflow-y:auto;
    box-shadow:-8px 0 24px rgba(0,0,0,0.15);
    padding:26px 30px 100px;
    animation:slidein .18s ease-out;
  }
  @keyframes slidein{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
  .drawer-head h2{font-size:21px;}
  .drawer-head .id-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .section{margin-bottom:22px;border-top:1px solid var(--line);padding-top:16px;}
  .section:first-of-type{border-top:none;padding-top:0;}
  .section h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--stamp-dark);margin-bottom:12px;font-family:'Inter',sans-serif;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .field .readonly{
    padding:7px 9px;background:var(--paper-2);border:1px dashed var(--line-strong);
    border-radius:3px;font-size:13px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;
  }
  .field textarea{resize:vertical;min-height:56px;}
  .field .hint{font-size:10.5px;color:var(--ink-faint);}
  .drawer-actions{
    position:sticky;bottom:-100px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:8px;background:var(--paper);
  }
  .badge-computed{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--stamp);border:1px solid var(--stamp-bg);background:var(--stamp-bg);padding:1px 6px;border-radius:8px;margin-left:6px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:4px;
    font-size:13px;opacity:0;transition:opacity .2s, transform .2s;z-index:99;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .err{font-size:11px;color:var(--red);margin-top:2px;}
  .field.error input, .field.error select{border-color:var(--red);}
  .tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line-strong);}
  .tab-btn{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--ink-soft);
    background:transparent;border:none;border-bottom:2px solid transparent;
    padding:9px 4px;margin-right:22px;cursor:pointer;border-radius:0;
  }
  .tab-btn:hover{background:transparent;color:var(--ink);}
  .tab-btn.active{color:var(--stamp-dark);border-bottom-color:var(--stamp);}
  .view{display:none;}
  .view.active{display:block;}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  @media (max-width:900px){.dash-grid{grid-template-columns:1fr;}}
  .panel{background:#FBFAF6;border:1px solid var(--line);border-radius:4px;padding:16px 18px;}
  .panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--stamp-dark);margin-bottom:14px;font-family:'Inter',sans-serif;font-weight:600;}
  .panel .panel-hint{font-size:10.5px;color:var(--ink-faint);margin:-10px 0 12px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer;padding:3px 4px;border-radius:3px;}
  .bar-row:hover{background:var(--stamp-bg);}
  .bar-row.active{background:var(--stamp-bg);}
  .bar-row .bar-label{width:150px;flex-shrink:0;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-row .bar-track{flex:1;background:var(--paper-2);border-radius:2px;height:16px;overflow:hidden;}
  .bar-row .bar-fill{height:100%;background:var(--stamp);border-radius:2px;transition:width .25s;}
  .bar-row .bar-fill.ganado{background:var(--green);}
  .bar-row .bar-fill.perdido{background:var(--red);}
  .bar-row .bar-fill.suspendido{background:var(--ink-faint);}
  .bar-row .bar-val{width:96px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;padding:4px;border-radius:3px;}
  .funnel-row:hover{background:var(--stamp-bg);}
  .funnel-row.active{background:var(--stamp-bg);}
  .funnel-stage{width:126px;flex-shrink:0;font-size:11.5px;color:var(--ink-soft);}
  .funnel-bar-wrap{flex:1;background:var(--paper-2);border-radius:2px;height:22px;position:relative;overflow:hidden;}
  .funnel-bar{height:100%;background:linear-gradient(90deg,var(--stamp),var(--stamp-dark));border-radius:2px;display:flex;align-items:center;padding-left:8px;color:#F4F7F5;font-size:11px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .kpi-row-2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  @media (max-width:720px){.kpi-row-2{grid-template-columns:1fr 1fr;}}
  .donut-wrap{display:flex;align-items:center;gap:20px;}
  .donut-legend{flex:1;}
  .legend-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;cursor:pointer;padding:2px 4px;border-radius:3px;font-size:12px;}
  .legend-row:hover{background:var(--stamp-bg);}
  .legend-row.active{background:var(--stamp-bg);}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-name{flex:1;color:var(--ink);}
  .legend-val{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .vencer-item{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
  .vencer-item:last-child{border-bottom:none;}
  .vencer-item .vname{color:var(--ink);}
  .vencer-item .vdays{font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .active-filter-bar{
    display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 12px;
    background:var(--stamp-bg);border:1px solid var(--stamp);border-radius:4px;font-size:12.5px;color:var(--stamp-dark);
  }
  .active-filter-bar button{padding:3px 9px;font-size:11.5px;}
  .empty-dash{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
  @media (max-width:720px){
    .app{padding:18px 14px 60px;}
    .kpis{grid-template-columns:1fr 1fr;}
    .kpi-row-2{grid-template-columns:1fr 1fr;}
    .grid2{grid-template-columns:1fr;}
    .table-wrap{overflow-x:auto;}
    table{min-width:900px;}
    .bar-row .bar-label{width:100px;}
    .funnel-stage{width:90px;}
  }
  .suite-nav{
    background:var(--stamp-dark);display:flex;align-items:center;gap:2px;
    padding:0 20px;height:42px;
  }
  .suite-nav a{
    color:#CFE0D8;text-decoration:none;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;
    padding:0 14px;height:42px;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;
  }
  .suite-nav a:hover{color:#fff;}
  .suite-nav a.current{color:#fff;border-bottom-color:var(--stamp);font-weight:600;}
  .suite-nav .suite-brand{
    color:#fff;font-family:'Montserrat',sans-serif;font-weight:600;font-size:12.5px;
    margin-right:10px;padding-right:14px;border-right:1px solid #2E5A4C;height:20px;display:flex;align-items:center;
  }
  @media (max-width:720px){
    .suite-nav{padding:0 14px;overflow-x:auto;}
    .suite-nav a{padding:0 10px;white-space:nowrap;}
  }
</style>
</head>

    </div>
  </div>

  <div class="view" id="viewPanorama">
    <div id="panoramaContent"></div>
  </div>
</div>

let DATA = [];
let editingId = null;

function fmtMoney(n){
  n = Number(n)||0;
  return 'US$ ' + Math.round(n).toLocaleString('es-AR');
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function diasEntre(fechaISO){
  if(!fechaISO) return null;
  const d1 = new Date(todayISO()+'T00:00:00');
  const d2 = new Date(fechaISO+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}
function nextId(){
  let max = 0;
  DATA.forEach(o=>{
    const m = /OPP-(\d+)/.exec(o.id);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'OPP-' + String(max+1).padStart(3,'0');
}
function allEecc(){
  return Object.values(EECC_POR_SEGMENTO).flat();
}
function bantScore(o){
  const vals = [o.bantBudget,o.bantAuthority,o.bantNeed,o.bantTimeline];
  let sum=0, count=0;
  vals.forEach(v=>{
    if(v==='✅ Sí'){sum+=1;count++;}
    else if(v==='⚠️ Parcial'){sum+=0.5;count++;}
    else if(v==='❌ No'){count++;}
  });
  return count ? (sum) : 0;
}
function computeFields(o){
  o.anioRecurrente = (Number(o.mesRecurrente)||0) * 12;
  o.valorTotal = (Number(o.montoOneShot)||0) + o.anioRecurrente;
  if(o.tipoContrato==='MRR') o.mrrArrEstimado = Number(o.mesRecurrente)||0;
  else if(o.tipoContrato==='ARR') o.mrrArrEstimado = o.anioRecurrente;
  else o.mrrArrEstimado = o.valorTotal;
  o.montoPonderado = o.valorTotal * (Number(o.probCierre)||0) / 100;
  o.diasRestantes = diasEntre(o.fechaDeadline);
  o.ingenieroPreventa = INGENIERO_POR_EECC[o.eecc] || '';
  o.responsableSegmento = RESPONSABLE_POR_SEGMENTO[o.segmento] || '';
  return o;
}
function estadoSemaforo(o){
  if(o.estadoFinal && o.estadoFinal!=='Abierto') return 'gris';
  if(o.diasRestantes===null) return 'gris';
  if(o.diasRestantes<=3) return 'rojo';
  if(o.diasRestantes<=14) return 'amarillo';
  return 'verde';
}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPmwJ5ZA-MzgVbDtL4cDn7RWpfYoDcbgo",
  projectId: "backlog-cc"
};
const FIRESTORE_DOC_URL = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/backlog/data?key=${FIREBASE_CONFIG.apiKey}`;
const LOCAL_CACHE_KEY = 'backlog_preventa_cache_v1';

function setSyncStatus(state, label){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  const icons = {ok:'☁️', busy:'🔄', error:'⚠️', offline:'📴'};
  el.textContent = (icons[state]||'☁️') + ' ' + label;
}

function firestoreValueToArray(doc){
  try{
    const raw = doc && doc.fields && doc.fields.json && doc.fields.json.stringValue;
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}

async function loadData(){
  setSyncStatus('busy', 'Cargando desde la nube…');
  try{
    const res = await fetch(FIRESTORE_DOC_URL);
    if(res.status === 404){
      DATA = [];
    }else if(res.ok){
      const doc = await res.json();
      DATA = firestoreValueToArray(doc);
    }else{
      throw new Error('HTTP ' + res.status);
    }
    DATA.forEach(computeFields);
    localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(DATA));
    setSyncStatus('ok', 'Sincronizado');
  }catch(e){
    setSyncStatus('error', 'Sin conexión — mostrando última copia local');
    try{
      const cached = localStorage.getItem(LOCAL_CACHE_KEY);
      DATA = cached ? JSON.parse(cached) : [];
    }catch(e2){
      DATA = [];
    }
    DATA.forEach(computeFields);
  }
}

async function saveData(){
  localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(DATA));
  setSyncStatus('busy', 'Guardando…');
  try{
    const body = {
      fields: {
        json: { stringValue: JSON.stringify(DATA) },
        updatedAt: { timestampValue: new Date().toISOString() }
      }
    };
    const url = FIRESTORE_DOC_URL + '&updateMask.fieldPaths=json&updateMask.fieldPaths=updatedAt';
    const res = await fetch(url, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    setSyncStatus('ok', 'Sincronizado');
    return true;
  }catch(e){
    setSyncStatus('error', 'No se pudo guardar en la nube — reintentá');
    showToast('⚠️ No se pudo sincronizar con la nube. Los cambios quedaron guardados solo en este navegador.');
    return false;
  }
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function getFiltered(){
  const seg = document.getElementById('fSegmento').value;
  const et = document.getElementById('fEtapa').value;
  const es = document.getElementById('fEstadoFinal').value;
  const vert = document.getElementById('fVertical').value;
  const eecc = document.getElementById('fEecc').value;
  const q = document.getElementById('fBuscar').value.trim().toLowerCase();
  return DATA.filter(o=>{
    if(seg && o.segmento!==seg) return false;
    if(et && o.etapa!==et) return false;
    if(es && o.estadoFinal!==es) return false;
    if(vert && o.vertical!==vert) return false;
    if(eecc && o.eecc!==eecc) return false;
    if(q && !((o.cliente||'').toLowerCase().includes(q) || (o.cuit||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function groupSum(list, keyFn, valFn){
  const map = new Map();
  list.forEach(o=>{
    const k = keyFn(o) || '(sin dato)';
    const cur = map.get(k) || {value:0,count:0};
    cur.value += valFn(o); cur.count += 1;
    map.set(k, cur);
  });
  return [...map.entries()].map(([k,v])=>({label:k,value:v.value,count:v.count})).sort((a,b)=>b.value-a.value);
}
function barListHtml(entries, filterId, activeVal, fillClass){
  if(!entries.length) return '<div class="empty-dash">Sin datos para mostrar todavía.</div>';
  const max = Math.max(...entries.map(e=>e.value), 1);
  return entries.map(e=>`
    <div class="bar-row ${e.label===activeVal?'active':''}" data-filter="${filterId}" data-val="${escapeHtml(e.label)}">
      <div class="bar-label" title="${escapeHtml(titleCase(e.label))}">${escapeHtml(titleCase(e.label))}</div>
      <div class="bar-track"><div class="bar-fill ${fillClass||''}" style="width:${Math.max(2,(e.value/max)*100)}%"></div></div>
      <div class="bar-val">${fmtMoney(e.value)}</div>
    </div>`).join('');
}
function wireBarClicks(containerEl){
  containerEl.querySelectorAll('[data-filter]').forEach(row=>{
    row.addEventListener('click', ()=>drillInto(row.getAttribute('data-filter'), row.getAttribute('data-val')));
  });
}

function renderTable(){
  const list = getFiltered();
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  if(DATA.length===0){
    tbody.innerHTML='';
    empty.style.display='block';
    document.querySelector('.table-wrap table').style.display='none';
    return;
  }
  document.querySelector('.table-wrap table').style.display='table';
  empty.style.display='none';
  if(list.length===0){
    tbody.innerHTML = `<tr><td colspan="17" style="text-align:center;color:var(--ink-soft);padding:30px;">Ninguna oportunidad coincide con los filtros.</td></tr>`;
    return;
  }
  tbody.innerHTML = list.map(o=>{
    const stageIdx = ETAPAS.indexOf(o.etapa);
    const dots = ETAPAS.map((_,i)=>`<span class="dot ${i<=stageIdx?'done':''}"></span>`).join('');
    const sem = estadoSemaforo(o);
    const diasTxt = o.diasRestantes===null ? '—' : (o.diasRestantes<0 ? `${Math.abs(o.diasRestantes)}d vencida` : `${o.diasRestantes}d`);
    return `<tr data-id="${o.id}">
      <td class="idcell">${o.id}</td>
      <td class="cliente-cell">${escapeHtml(o.cliente||'—')}${o.cuit?`<span class="cuit">${escapeHtml(o.cuit)}</span>`:''}</td>
      <td><span class="seg-pill">${o.segmento||'—'}</span></td>
      <td><div class="etapa-track">${dots}<span class="etapa-label">${o.etapa? o.etapa.replace(/^\d-/,''):'—'}</span></div></td>
      <td>${o.probCierre?o.probCierre+'%':'—'}</td>
      <td>${o.eecc? titleCase(o.eecc):'—'}</td>
      <td class="bant-cell" title="Budget: ${o.bantBudget||'—'}">${bantIcon(o.bantBudget)}</td>
      <td class="bant-cell" title="Authority: ${o.bantAuthority||'—'}">${bantIcon(o.bantAuthority)}</td>
      <td class="bant-cell" title="Need: ${o.bantNeed||'—'}">${bantIcon(o.bantNeed)}</td>
      <td class="bant-cell" title="Timeline: ${o.bantTimeline||'—'}">${bantIcon(o.bantTimeline)}</td>
      <td class="money">${o.montoOneShot?fmtMoney(o.montoOneShot):'—'}</td>
      <td class="money">${o.mesRecurrente?fmtMoney(o.mesRecurrente):'—'}</td>

      <td class="estprop-cell">${o.estadoPropuesta||'—'}</td>
      <td><span class="semaforo"><span class="dot dot-${sem}"></span>${o.estadoFinal||'Abierto'}</span></td>

  }).join('');
  tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
    tr.addEventListener('dblclick', ()=>openDrawer(tr.getAttribute('data-id')));
  });
}
function bantIcon(v){
  if(v==='✅ Sí') return '✅';
  if(v==='⚠️ Parcial') return '⚠️';
  if(v==='❌ No') return '❌';
  if(v==='N/A') return '·';
  return '—';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function titleCase(s){ return String(s).toLowerCase().replace(/(^|\s)\S/g, t=>t.toUpperCase()); }

function optionsHtml(list, selected){
  return '<option value="">—</option>' + list.map(v=>`<option value="${escapeHtml(v)}" ${v===selected?'selected':''}>${escapeHtml(v)}</option>`).join('');
}

      <div class="field"><label>Tipo de proyecto</label><select id="f_tipoProyecto">${optionsHtml(TIPO_PROYECTO,o.tipoProyecto)}</select></div>
      <div class="field"><label>Competidores identificados</label><input type="text" id="f_competidores" value="${escapeHtml(o.competidores)}"></div>
    </div>

    <div class="section">
      <h3>Fechas</h3>
      <div class="grid2">
        <div class="field"><label>Fecha entrada</label><input type="date" id="f_fechaEntrada" value="${o.fechaEntrada||''}"></div>
        <div class="field"><label>Fecha deadline</label><input type="date" id="f_fechaDeadline" value="${o.fechaDeadline||''}"></div>
      </div>
      <div class="field"><label>Fecha estimada de cierre</label><input type="date" id="f_fechaEstCierre" value="${o.fechaEstCierre||''}"></div>
      <div class="field"><label>Días restantes <span class="badge-computed">auto</span></label><div class="readonly" id="f_dias_ro">${o.diasRestantes===null?'—':o.diasRestantes+' días'}</div></div>
    </div>

    <div class="section">
      <h3>Económico</h3>
      <div class="grid2">
        <div class="field"><label>Tipo contrato</label><select id="f_tipoContrato">${optionsHtml(TIPO_CONTRATO,o.tipoContrato)}</select></div>
        <div class="field"><label>Monto One Shot USD</label><input type="number" min="0" id="f_montoOneShot" value="${o.montoOneShot}"></div>
      </div>
      <div class="field"><span class="hint">One Shot: implementación, licencias o venta de producto — pago único.</span></div>
      <div class="grid2">
        <div class="field"><label>Mes recurrente USD</label><input type="number" min="0" id="f_mesRecurrente" value="${o.mesRecurrente}"></div>
        <div class="field"><label>Año recurrente USD <span class="badge-computed">auto</span></label><div class="readonly" id="f_anio_ro">${fmtMoney(o.anioRecurrente)}</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Valor total USD <span class="badge-computed">auto</span></label><div class="readonly" id="f_valorTotal_ro">${fmtMoney(o.valorTotal)}</div></div>
        <div class="field"><label>MRR/ARR estimado USD <span class="badge-computed">auto</span></label><div class="readonly" id="f_mrrArr_ro">${fmtMoney(o.mrrArrEstimado)}</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Monto ponderado USD <span class="badge-computed">auto</span></label><div class="readonly" id="f_ponderado_ro">${fmtMoney(o.montoPonderado)}</div></div>
        <div class="field"><label>Margen estimado %</label><input type="number" min="0" max="100" id="f_margenEstimado" value="${o.margenEstimado}"></div>
      </div>
      <div class="field"><label>Horas invertidas</label><input type="number" min="0" id="f_horasInvertidas" value="${o.horasInvertidas}"></div>
    </div>

    <div class="section">
      <h3>Seguimiento</h3>
      <div class="grid2">
        <div class="field"><label>Estado propuesta</label><select id="f_estadoPropuesta">${optionsHtml(ESTADO_PROPUESTA,o.estadoPropuesta)}</select></div>
        <div class="field"><label>Documentos generados</label><select id="f_documentosGenerados">${optionsHtml(DOCUMENTOS_GENERADOS,o.documentosGenerados)}</select></div>
      </div>
      <div class="field"><label>Notas técnicas</label><textarea id="f_notasTecnicas">${escapeHtml(o.notasTecnicas)}</textarea></div>
    </div>

    <div class="section">
      <h3>Cierre</h3>
      <div class="grid2">
        <div class="field"><label>Estado final</label><select id="f_estadoFinal">${optionsHtml(ESTADO_FINAL,o.estadoFinal)}</select></div>
        <div class="field"><label>Motivo pérdida</label><select id="f_motivoPerdida">${optionsHtml(MOTIVO_PERDIDA,o.motivoPerdida)}</select></div>
      </div>
      <div class="field"><label>Fecha cierre real</label><input type="date" id="f_fechaCierreReal" value="${o.fechaCierreReal||''}"></div>
    </div>

    <div class="drawer-actions">
      <div>${editingId?'<button class="danger" id="btnDelete">Eliminar</button>':''}</div>
      <div style="display:flex;gap:8px;">
        <button class="ghost" id="btnCancel">Cancelar</button>
        <button class="primary" id="btnSave">Guardar</button>
      </div>
    </div>
  `;
}

function refreshEeccOptions(o){
  const seg = document.getElementById('f_segmento').value;
  const eeccSel = document.getElementById('f_eecc');
  const list = EECC_POR_SEGMENTO[seg] || [];
  eeccSel.innerHTML = optionsHtml(list, list.includes(o.eecc)?o.eecc:'');
}
function refreshComputedDisplays(o){
  computeFields(o);
  document.getElementById('f_ingeniero_ro').textContent = o.ingenieroPreventa? titleCase(o.ingenieroPreventa):'—';
  document.getElementById('f_responsable_ro').textContent = o.responsableSegmento? titleCase(o.responsableSegmento):'—';
  document.getElementById('f_bantScore_ro').textContent = bantScore(o)+'/4';
  document.getElementById('f_dias_ro').textContent = o.diasRestantes===null?'—':o.diasRestantes+' días';
  document.getElementById('f_anio_ro').textContent = fmtMoney(o.anioRecurrente);
  document.getElementById('f_valorTotal_ro').textContent = fmtMoney(o.valorTotal);
  document.getElementById('f_mrrArr_ro').textContent = fmtMoney(o.mrrArrEstimado);
  document.getElementById('f_ponderado_ro').textContent = fmtMoney(o.montoPonderado);
}

function readFormInto(o){
  o.cliente = document.getElementById('f_cliente').value.trim();
  o.cuit = document.getElementById('f_cuit').value.trim();
  o.industria = document.getElementById('f_industria').value;
  o.segmento = document.getElementById('f_segmento').value;
  o.eecc = document.getElementById('f_eecc').value;
  o.bantBudget = document.getElementById('f_bantBudget').value;
  o.bantAuthority = document.getElementById('f_bantAuthority').value;
  o.bantNeed = document.getElementById('f_bantNeed').value;
  o.bantTimeline = document.getElementById('f_bantTimeline').value;
  o.bantObs = document.getElementById('f_bantObs').value;
  o.etapa = document.getElementById('f_etapa').value;
  o.probCierre = document.getElementById('f_probCierre').value;
  o.vertical = document.getElementById('f_vertical').value;
  o.proveedor = document.getElementById('f_proveedor').value;
  o.tipoProyecto = document.getElementById('f_tipoProyecto').value;
  o.competidores = document.getElementById('f_competidores').value;
  o.fechaEntrada = document.getElementById('f_fechaEntrada').value;
  o.fechaDeadline = document.getElementById('f_fechaDeadline').value;
  o.fechaEstCierre = document.getElementById('f_fechaEstCierre').value;
  o.tipoContrato = document.getElementById('f_tipoContrato').value;
  o.montoOneShot = document.getElementById('f_montoOneShot').value;
  o.mesRecurrente = document.getElementById('f_mesRecurrente').value;
  o.margenEstimado = document.getElementById('f_margenEstimado').value;
  o.horasInvertidas = document.getElementById('f_horasInvertidas').value;
  o.estadoPropuesta = document.getElementById('f_estadoPropuesta').value;
  o.documentosGenerados = document.getElementById('f_documentosGenerados').value;
  o.notasTecnicas = document.getElementById('f_notasTecnicas').value;
  o.estadoFinal = document.getElementById('f_estadoFinal').value;
  o.motivoPerdida = document.getElementById('f_motivoPerdida').value;
  o.fechaCierreReal = document.getElementById('f_fechaCierreReal').value;
  o.ultimaActualizacion = todayISO();
  return o;
}

function wireDrawer(o){
  refreshEeccOptions(o);
  document.getElementById('btnCloseDrawer').addEventListener('click', closeDrawer);
  document.getElementById('btnCancel').addEventListener('click', closeDrawer);
  document.getElementById('f_segmento').addEventListener('change', ()=>{
    o.eecc='';
    refreshEeccOptions(o);
    readFormInto(o);
    refreshComputedDisplays(o);
  });
  ['f_eecc','f_bantBudget','f_bantAuthority','f_bantNeed','f_bantTimeline','f_fechaDeadline',
   'f_tipoContrato','f_montoOneShot','f_mesRecurrente','f_probCierre'].forEach(id=>{
    document.getElementById(id).addEventListener('change', ()=>{ readFormInto(o); refreshComputedDisplays(o); });
    document.getElementById(id).addEventListener('input', ()=>{ readFormInto(o); refreshComputedDisplays(o); });
  });
  const delBtn = document.getElementById('btnDelete');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{
      if(confirm('¿Eliminar esta oportunidad? No se puede deshacer.')){
        DATA = DATA.filter(x=>x.id!==editingId);
        await saveData();
        closeDrawer();
        renderAll();
        showToast('Oportunidad eliminada');
      }
    });
  }
  document.getElementById('btnSave').addEventListener('click', async ()=>{
    readFormInto(o);
    const clienteField = document.getElementById('f_cliente').parentElement;
    const segField = document.getElementById('f_segmento').parentElement;
    let ok = true;
    clienteField.classList.remove('error'); segField.classList.remove('error');
    if(!o.cliente){ clienteField.classList.add('error'); ok=false; }
    if(!o.segmento){ segField.classList.add('error'); ok=false; }
    if(!ok){ showToast('Completá cliente y segmento'); return; }
    computeFields(o);
    const existingIdx = DATA.findIndex(x=>x.id===o.id);
    if(existingIdx > -1){
      DATA[existingIdx] = o;
    } else {
      DATA.push(o);
    }
    editingId = o.id;
    const saved = await saveData();
    closeDrawer();
    renderAll();
    if(saved) showToast('Guardado');
  });
}

function renderAll(){
  DATA.forEach(computeFields);
  renderKpis();
  renderTable();
  if(document.getElementById('viewPanorama').classList.contains('active')) renderDashboard();
  document.getElementById('subtitle').textContent = DATA.length + (DATA.length===1?' oportunidad registrada':' oportunidades registradas');
}

function toCsv(){
  const cols = ['id','cliente','cuit','industria','segmento','eecc','ingenieroPreventa','responsableSegmento',
    'bantBudget','bantAuthority','bantNeed','bantTimeline','bantObs','etapa','probCierre','vertical','proveedor',
    'tipoProyecto','competidores','fechaEntrada','fechaDeadline','fechaEstCierre','diasRestantes','tipoContrato',
    'montoOneShot','mesRecurrente','anioRecurrente','valorTotal','mrrArrEstimado','montoPonderado','margenEstimado',
    'horasInvertidas','estadoPropuesta','documentosGenerados','notasTecnicas','estadoFinal','motivoPerdida',
    'fechaCierreReal','ultimaActualizacion'];
  const rows = [cols.join(',')];
  DATA.forEach(o=>{
    computeFields(o);
    rows.push(cols.map(c=>{
      let v = o[c]===undefined||o[c]===null?'':String(o[c]);
      v = v.replace(/"/g,'""');
      return /[,"\n]/.test(v) ? `"${v}"` : v;
    }).join(','));
  });
  return rows.join('\n');
}
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btnNew').addEventListener('click', ()=>openDrawer(null));
document.getElementById('btnNewEmpty').addEventListener('click', ()=>openDrawer(null));
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeDrawer(); });
document.getElementById('fSegmento').addEventListener('change', renderTable);
document.getElementById('fEtapa').addEventListener('change', renderTable);
document.getElementById('fEstadoFinal').addEventListener('change', renderTable);
document.getElementById('fVertical').addEventListener('change', renderTable);
document.getElementById('fEecc').addEventListener('change', renderTable);
document.getElementById('fBuscar').addEventListener('input', renderTable);
document.getElementById('btnClearFilters').addEventListener('click', ()=>{
  document.getElementById('fSegmento').value='';
  document.getElementById('fEtapa').value='';
  document.getElementById('fEstadoFinal').value='';
  document.getElementById('fVertical').value='';
  document.getElementById('fEecc').value='';
  document.getElementById('fBuscar').value='';
  renderTable();
});
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>switchTab(btn.getAttribute('data-tab')));
});
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===tab));
  document.getElementById('viewTabla').classList.toggle('active', tab==='tabla');
  document.getElementById('viewPanorama').classList.toggle('active', tab==='panorama');
  if(tab==='panorama') renderDashboard();
}
function drillInto(filterId, value){
  const el = document.getElementById(filterId);
  el.value = (el.value===value) ? '' : value;
  renderTable();
  switchTab('tabla');
}
document.getElementById('btnExportJson').addEventListener('click', ()=>{
  downloadFile(JSON.stringify(DATA,null,2), 'backlog_preventa.json', 'application/json');
});
document.getElementById('btnExportCsv').addEventListener('click', ()=>{
  downloadFile(toCsv(), 'backlog_preventa.csv', 'text/csv');
});
document.getElementById('btnImport').addEventListener('click', ()=>{
  document.getElementById('fileImport').click();
});
document.getElementById('fileImport').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('formato inválido');
    DATA = imported;
    DATA.forEach(computeFields);
    await saveData();
    renderAll();
    showToast('Datos importados: ' + DATA.length + ' oportunidades');
  }catch(err){
    showToast('No se pudo importar el archivo');
  }
  e.target.value='';
});

(async function init(){
  populateFilterSelects();
  await loadData();
  renderAll();
})();
</script>
</body>
</html>
