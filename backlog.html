<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Backlog · Preventa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css?v=20261029f">

<style>
/* ============================================================
   Backlog nuevo (estilo tablero). Todo color/fuente sale de las
   variables de design-system.css, así responde a los 5 temas.
   ============================================================ */
html,body{height:100%;}
body{display:flex;flex-direction:column;min-height:100vh;}
.shell{display:flex;flex:1;min-height:0;}

/* Barra de íconos */
.rail{width:64px;flex:none;background:var(--paper-2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;}
.rail button,.rail a{width:46px;height:46px;border-radius:8px;border:0;background:transparent;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;position:relative;padding:0;cursor:pointer;text-decoration:none;}
.rail button:hover,.rail a:hover{background:var(--paper);color:var(--ink);border:0;}
.rail button.on{background:var(--stamp-bg);color:var(--stamp-dark);}
.rail .sep{width:32px;height:1px;background:var(--line);margin:6px 0;}
.rail .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.rail svg{width:20px;height:20px;}
.tip{position:relative;}
.tip::after{content:attr(data-tip);position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--paper-2);font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:50;}
.tip:hover::after{opacity:1;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto;}
.page{padding:22px 26px;display:flex;flex-direction:column;gap:16px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.head .crumb{font-size:13px;color:var(--ink-faint);}
.head h1{font-size:24px;letter-spacing:-0.02em;}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sync{font-size:12px;color:var(--ink-faint);}

.btn{font-family:var(--sans);font-size:14px;font-weight:500;height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--stamp);background:var(--paper-2);}
.btn.pri{background:var(--stamp-dark);border-color:var(--stamp-dark);color:#fff;font-weight:600;}
.btn.pri:hover{background:var(--stamp);border-color:var(--stamp);}
.btn.sm{height:32px;font-size:13px;padding:0 10px;}
.btn.link{border:0;background:transparent;color:var(--stamp-dark);padding:0 4px;}
.btn.dan{color:var(--red);border-color:var(--red);}
.btn svg{width:16px;height:16px;}

/* Filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;background:var(--paper-2);border:1px solid var(--line-strong);border-radius:6px;min-width:220px;flex:0 1 280px;}
.search input{border:0;outline:0;background:transparent;font-family:var(--sans);font-size:14px;color:var(--ink);flex:1;min-width:0;}
.chip{font-family:var(--sans);font-size:13px;font-weight:500;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);cursor:pointer;}
.chip.on{background:var(--stamp-dark);border-color:var(--stamp-dark);color:#fff;}
.chip.warn{border-style:dashed;border-color:var(--gold);background:var(--gold-bg);color:var(--ink);}
.chip.warn.on{background:var(--gold);color:#fff;border-style:solid;}
.sel{font-family:var(--sans);font-size:13px;height:32px;padding:0 8px;border-radius:6px;border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink);}

/* Tablero */
.board-wrap{overflow-x:auto;padding-bottom:6px;}
.board{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;align-items:start;min-width:1420px;}
.col{background:var(--zebra-even);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:560px;transition:outline .1s;}
.col.drop{outline:2px dashed var(--stamp);}
.col-h{padding:2px 6px 6px;display:flex;flex-direction:column;gap:2px;}
.col-h .t{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.col-h h2{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
.col-h .n{font-size:12px;font-weight:600;background:var(--paper-2);border-radius:10px;padding:1px 8px;color:var(--ink-soft);}
.col-h .s{font-size:12px;color:var(--ink-faint);}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);text-align:left;font-family:var(--sans);color:var(--ink);width:100%;}
.card:hover{border-color:var(--stamp);}
.card.selected{border:2px solid var(--stamp-dark);box-shadow:0 0 0 3px var(--stamp-bg);}
.card .ti{font-size:14px;font-weight:600;line-height:1.3;}
.card .cl{font-size:13px;color:var(--ink-soft);}
.card .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card .key{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--paper);color:var(--ink);}
.tag.Banca{background:var(--stamp-bg);color:var(--stamp-dark);}
.tag.Servicios{background:var(--green-bg);color:var(--green);}
.tag.Industria{background:var(--gold-bg);color:var(--ink);}
.tag.sin{background:var(--gold-bg);color:var(--ink);outline:1px dashed var(--gold);}
.tag.camp{background:var(--paper);color:var(--ink-soft);}
.dots{display:flex;gap:3px;}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--line-strong);display:block;}
.dots i.Si{background:var(--green);} .dots i.Parcial{background:var(--gold);} .dots i.No{background:var(--red);} .dots i.NA{background:var(--ink-faint);}
.next{width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.next svg{width:12px;height:12px;}
.next.ok{background:var(--green);} .next.sin{background:var(--gold);} .next.venc{background:var(--red);}
.pr{display:inline-flex;}
.pr svg{width:14px;height:14px;}
.pr.Alta{color:var(--red);} .pr.Media{color:var(--gold);} .pr.Baja{color:var(--stamp-dark);}
.add-in-col{border:0;background:transparent;color:var(--ink-soft);text-align:left;padding:8px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;font-family:var(--sans);}
.add-in-col:hover{background:var(--paper-2);border:0;}
.add-in-col svg,.search svg,.chk .next svg{width:16px;height:16px;flex:none;}
.search svg{color:var(--ink-faint);}
.empty{padding:40px;text-align:center;color:var(--ink-faint);background:var(--paper-2);border:1px dashed var(--line-strong);border-radius:8px;}

/* Tablas */
.tbl-wrap{overflow-x:auto;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-soft);padding:10px 12px;background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl tr.click{cursor:pointer;} .tbl tr.click:hover td{background:var(--zebra-odd);}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* Panel lateral */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--paper-2);border-left:1px solid var(--line-strong);box-shadow:-10px 0 28px rgba(0,0,0,.12);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s ease;}
.panel.open{transform:none;}
.panel.full{width:min(1100px,100vw);}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);}
.panel-h .key{font-family:var(--mono);font-size:13px;color:var(--ink-soft);}
.icon-btn{width:36px;height:36px;border-radius:6px;border:0;background:transparent;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.icon-btn:hover{background:var(--paper);border:0;}
.icon-btn svg{width:17px;height:17px;}
.panel-b{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
.panel.full .panel-b{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start;}
.panel.full .colA,.panel.full .colB{display:flex;flex-direction:column;gap:16px;}
.colA,.colB{display:contents;}
.panel.full .colA,.panel.full .colB{display:flex;}
.ttl-in{font-family:var(--display);font-size:21px;font-weight:700;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px;background:transparent;color:var(--ink);width:100%;}
.ttl-in:hover,.ttl-in:focus{border-color:var(--line-strong);outline:0;}
.sub{font-size:14px;color:var(--ink-soft);}
.box{background:var(--paper);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.box h3,.sec h3{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}
.sec{display:flex;flex-direction:column;gap:8px;}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-soft);}
.fld input,.fld select,.fld textarea,.inp{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--paper-2);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;min-height:38px;width:100%;}
.fld textarea{resize:vertical;line-height:1.45;}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid var(--stamp);outline-offset:-1px;}
.fld select.stage{background:var(--stamp-bg);color:var(--stamp-dark);font-weight:600;border-color:var(--stamp-dark);}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;flex:none;}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0;background:var(--paper-2);color:var(--ink-soft);font-size:13px;height:32px;min-width:54px;padding:0 9px;}
.seg button:last-child{border-right:0;}
.seg button:hover{background:var(--paper);border-color:var(--line);}
.seg button.on.Si{background:var(--green);color:#fff;} .seg button.on.Parcial{background:var(--gold);color:#fff;}
.seg button.on.No{background:var(--red);color:#fff;} .seg button.on.NA{background:var(--ink-faint);color:#fff;}
.bant-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;}
.bant-row small{color:var(--ink-faint);font-size:12px;}
.pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{font-family:var(--sans);font-size:12.5px;height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--line-strong);background:var(--paper-2);color:var(--ink-soft);cursor:pointer;}
.pill.on{background:var(--stamp-bg);border-color:var(--stamp-dark);color:var(--stamp-dark);font-weight:600;}
.log{display:flex;flex-direction:column;gap:10px;}
.log-e{display:flex;gap:10px;align-items:flex-start;}
.log-e .ic{width:30px;height:30px;border-radius:15px;background:var(--zebra-even);display:flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:700;color:var(--ink-soft);}
.log-e .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.log-e .mt{font-size:12.5px;color:var(--ink-faint);}
.log-e .mt b{color:var(--ink);font-weight:600;}
.log-e .x{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;padding:2px 6px;font-size:16px;}
.chips-auto{display:flex;gap:6px;flex-wrap:wrap;}
.chips-auto span{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--paper);color:var(--ink-soft);}
details.more{border-top:1px solid var(--line);padding-top:12px;}
details.more summary{font-size:14px;font-weight:600;cursor:pointer;}
details.more .grid2{margin-top:12px;}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.money .v{font-size:18px;font-weight:700;}
.money .l{font-size:12px;color:var(--ink-faint);}
.panel-f{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;}

/* Modales */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--paper-2);border-radius:10px;box-shadow:0 14px 44px rgba(0,0,0,.25);width:min(600px,100%);display:flex;flex-direction:column;}
.modal.wide{width:min(1180px,100%);}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);}
.modal-h h2{font-size:19px;font-weight:700;}
.modal-b{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.req{color:var(--red);}
.warnline{font-size:12.5px;color:var(--ink);background:var(--gold-bg);border-radius:6px;padding:8px 10px;}
.okline{font-size:12.5px;color:var(--green);}

/* KPIs y staff */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
.kpi{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;}
.kpi .l{font-size:12px;color:var(--ink-faint);} .kpi .v{font-size:21px;font-weight:700;} .kpi .n{font-size:12px;color:var(--ink-faint);}
.two{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;}
.two>.a{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:14px;}
.two>.b{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:14px;}
.card-s{background:var(--paper-2);border:1px solid var(--line);border-radius:8px;}
.card-s>.hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.card-s>.hd h2{font-size:15px;font-weight:700;}
.card-s>.hd small{color:var(--ink-faint);font-size:12.5px;}
.card-s>.bd{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;}
.chk:last-child{border-bottom:0;}
.chk input{width:17px;height:17px;flex:none;}
.chk .r{margin-left:auto;color:var(--ink-faint);font-size:12.5px;white-space:nowrap;}
.chk .tp{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:4px;background:var(--stamp-bg);color:var(--stamp-dark);min-width:62px;text-align:center;}

/* Ideas */
.ideas-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start;}
.idea{background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;font-family:var(--sans);color:var(--ink);width:100%;display:flex;flex-direction:column;gap:4px;}
.idea.selected{border:2px solid var(--stamp-dark);box-shadow:0 0 0 3px var(--stamp-bg);}
.idea b{font-size:14px;} .idea span{font-size:12px;color:var(--ink-soft);}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:10px 16px;border-radius:6px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:120;max-width:90vw;}
#toast.show{opacity:1;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.ro .edit-only{display:none !important;}

@media (max-width:820px){
  .rail{width:54px;} .rail button,.rail a{width:42px;height:42px;}
  .page{padding:16px 14px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  .panel.full .panel-b{display:flex;}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr));}
  .tip::after{display:none;}
}
</style>
</head>

<script>
'use strict';
/* ════════════════════════ Configuración ════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPmwJ5ZA-MzgVbDtl4cDn7RWpfYoDcbgo",
  authDomain: "backlog-cc.firebaseapp.com",
  projectId: "backlog-cc"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const ALLOWED_USERS = { 'ecelata@gmail.com':'editor', 'emcelata@personal.com.ar':'readonly' };
let CURRENT_ROLE = null;
const isReadonly = () => CURRENT_ROLE === 'readonly';

const FS_BASE = `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/backlog`;
// Documento propio del Backlog nuevo: no toca backlog/data (Backlog clásico).
const DOC_URL = `${FS_BASE}/oportunidades_v2?key=${FIREBASE_CONFIG.apiKey}`;
const CUENTAS_URL = `${FS_BASE}/cuentas?key=${FIREBASE_CONFIG.apiKey}`;
const CACHE_KEY = 'backlog_v2_cache';

const ETAPAS = ['1-Identificada','2-POC','3-En Diseño','4-Arquitectura','5-En Pricing/PPCC','6-Envío y Negociación'];
const etapaLabel = e => String(e||'').replace(/^(\d)-/, '$1 · ');
const SEGMENTOS = ['Banca','CCEE Servicios','CCEE Industria'];
const PRIORIDADES = ['Alta','Media','Baja'];
const ESTADOS = ['Abierto','Ganado','Perdido','Suspendido'];
const BANT_KEYS = [['bantBudget','Budget','tiene presupuesto'],['bantAuthority','Authority','hablamos con quien decide'],['bantNeed','Need','necesidad clara'],['bantTimeline','Timeline','fecha para decidir']];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2600); }
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
function fmtDate(iso){ if(!iso) return ''; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m ? `${m[3]}/${m[2]}/${m[1]}` : iso; }
function fmtShort(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m ? `${m[3]}/${m[2]}` : ''; }
// Números: los guardados son number; los del Excel pueden venir "2875.5", "2,875.50" o "2.875,50".
function num(v){
  if(typeof v==='number') return isNaN(v)?0:v;
  let t = String(v==null?'':v).trim().replace(/[^0-9.,-]/g,''); if(!t) return 0;
  const lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  if(lc>ld){ t = t.replace(/\./g,'').replace(',','.'); } else if(ld>lc && lc>=0){ t = t.replace(/,/g,''); }
  else if(lc>=0 && ld<0){ t = /,\d{3}$/.test(t) && t.split(',').length>2 ? t.replace(/,/g,'') : t.replace(',','.'); }
  const n = parseFloat(t); return isNaN(n)?0:n;
}
function numInput(v){ const n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; }
function money(n, div){ return (div==='ARS'?'$ ':'US$ ') + Math.round(n||0).toLocaleString('es-AR'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function download(text, name, type){ const b=new Blob([text],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u); }
function normTokens(s){ return String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean); }
function normalizeCore(s){ let w = normTokens(s); while(w.length>1 && w[w.length-1].length<=3) w.pop(); return w.join(' '); }
const PARTICULAS = new Set(['DE','LA','DEL','LOS','LAS','Y']);
// ¿El nombre del portal ("Nombre Apellido") es el mismo EECC que el de la cartera ("APELLIDO NOMBRE")?
// Exige que coincida el apellido (primer token no-partícula de la cartera) y al menos otro token;
// admite tokens truncados por la cartera (MAXIMILIA ↔ MAXIMILIANO).
function sameEecc(cartera, portal){
  const a = normTokens(cartera), b = normTokens(portal);
  if(!a.length || !b.length) return false;
  const eq = (x,y) => x===y || (x.length>=5 && y.startsWith(x)) || (y.length>=5 && x.startsWith(y));
  const has = t => b.some(y=>eq(t,y));
  const ape = a.find(t=>!PARTICULAS.has(t));
  if(!ape || !has(ape)) return false;
  return a.filter(t=>!PARTICULAS.has(t) && t!==ape && has(t)).length >= 1;
}
function matchMisEecc(portalName){ return MIS_EECC.find(e=>sameEecc(e, portalName)) || ''; }
function segShort(s){ return s==='Banca'?'Banca':s==='CCEE Servicios'?'Servicios':s==='CCEE Industria'?'Industria':''; }

/* ════════════════════════ Firestore ════════════════════════ */
async function authHeader(){ if(!auth.currentUser) return {}; return {'Authorization':'Bearer ' + await auth.currentUser.getIdToken()}; }
function setSync(txt){ const el=$('#sync'); if(el) el.textContent = txt; }
async function loadDB(){
  try{
    const res = await fetch(DOC_URL, {headers: await authHeader()});
    if(res.status === 404){ /* primera vez: documento vacío */ }
    else if(res.ok){
      const doc = await res.json();
      const raw = doc && doc.fields && doc.fields.json && doc.fields.json.stringValue;
      if(raw) DB = Object.assign(DB, JSON.parse(raw));
    } else throw new Error('HTTP '+res.status);
    localStorage.setItem(CACHE_KEY, JSON.stringify(DB));
    return true;
  }catch(e){
    try{ const c = localStorage.getItem(CACHE_KEY); if(c) DB = Object.assign(DB, JSON.parse(c)); }catch(_){}
    toast('Sin conexión con la nube: mostrando la última copia de este navegador.');
    return false;
  }
}
let saveTimer = null;
function save(){
  if(isReadonly()) return;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(DB)); }catch(_){}
  setSync('Guardando…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 600);
}
async function saveNow(){
  try{
    const body = { fields:{ json:{stringValue: JSON.stringify(DB)}, updatedAt:{timestampValue:new Date().toISOString()} } };
    const res = await fetch(DOC_URL + '&updateMask.fieldPaths=json&updateMask.fieldPaths=updatedAt', {
      method:'PATCH', headers:{'Content-Type':'application/json', ...(await authHeader())}, body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    setSync('Guardado en la nube');
  }catch(e){
    setSync('Sin guardar en la nube');
    toast('⚠️ No se pudo guardar en la nube. Los cambios quedaron en este navegador; reintento con el próximo cambio.');
  }
}

function segmentoDeTipoHolding(t){ t=(t||'').toUpperCase(); if(t.includes('FINANZAS')) return 'Banca'; if(t.includes('SERVICIOS')) return 'CCEE Servicios'; if(t.includes('INDUSTRIA')) return 'CCEE Industria'; return ''; }
async function loadAccounts(){
  try{
    const res = await fetch(CUENTAS_URL, {headers: await authHeader()});
    if(!res.ok) throw new Error();
    const doc = await res.json();
    const text = doc && doc.fields && doc.fields.csv && doc.fields.csv.stringValue;
    if(!text) throw new Error();
    const rows = Papa.parse(text, {header:true, skipEmptyLines:true}).data.filter(r=>{
      const g1=(r['Gerente G1 Comercial']||'').trim(), g2=(r['Gerente G2 Comercial']||'').trim(), jefe=(r['Jefe/Coordinador']||'').trim();
      return g1==='RAMIREZ GONZALO' && (g2==='CASIL SILVANA PAULA' || jefe==='URRUTIGOITY RAUL' || jefe==='BANOVAZ GABRIELA EDITH');
    });
    ACCOUNTS = rows.map(r=>({
      razonSocial:(r['Razón Social']||'').trim(), cuit:(r['Cuit']||'').trim(), eecc:(r['Ejecutivo']||'').trim(),
      ingenieroPreventa:(r['Ingeniero']||'').trim(),
      responsable:(r['Gerente G2 Comercial']||'').trim() && r['Gerente G2 Comercial'].trim()!=='A DESIGNAR' ? r['Gerente G2 Comercial'].trim() : (r['Jefe/Coordinador']||'').trim(),
      industria:(r['VERTICAL']||'').trim(), segmento: segmentoDeTipoHolding(r['Tipo Holding'])
    })).filter(a=>a.razonSocial);
  }catch(e){ ACCOUNTS = []; }
  ACC_BY_NAME = {}; ACC_BY_CORE = {};
  ACCOUNTS.forEach(a=>{ ACC_BY_NAME[a.razonSocial.toLowerCase()] = a; const c=normalizeCore(a.razonSocial); (ACC_BY_CORE[c]=ACC_BY_CORE[c]||[]).push(a); });
  MIS_EECC = [...new Set(ACCOUNTS.map(a=>a.eecc).filter(Boolean))].sort();
}
function findAccount(name){
  const ex = ACC_BY_NAME[String(name||'').trim().toLowerCase()]; if(ex) return ex;
  const c = ACC_BY_CORE[normalizeCore(name)] || []; return c.length===1 ? c[0] : null;
}
function applyAccount(o, acc){
  if(!acc) return;
  o.cliente = acc.razonSocial; o.cuit = acc.cuit; o.eecc = acc.eecc; o.ingenieroPreventa = acc.ingenieroPreventa;
  o.responsableSegmento = acc.responsable; o.industria = acc.industria; if(acc.segmento) o.segmento = acc.segmento;
}

function newOpp(extra){
  const id = 'BK-' + String(DB.nextSeq++).padStart(3,'0');
  return Object.assign({ id, cliente:'', nombreOpp:'', etapa:ETAPAS[0], prioridad:'Media', estadoFinal:'Abierto', divisa:'USD',
    mesRecurrente:0, montoOneShot:0, probCierre:'', proximoPaso:'', proximoPasoFecha:'', bitacora:[],
    bantBudget:'', bantAuthority:'', bantNeed:'', bantTimeline:'', fechaEntrada: todayISO(), origen:'manual' }, extra||{});
}
const isOpen = o => !o.estadoFinal || o.estadoFinal === 'Abierto';
const sinMonto = o => !num(o.mesRecurrente) && !num(o.montoOneShot);
function nextState(o){
  if(!String(o.proximoPaso||'').trim()) return 'sin';
  if(o.proximoPasoFecha && o.proximoPasoFecha < todayISO()) return 'venc';
  return 'ok';
}
const NEXT_LABEL = { ok:'Próximo paso al día', sin:'Sin próximo paso', venc:'Próximo paso vencido' };
function montoLabel(o){
  const m = num(o.mesRecurrente), u = num(o.montoOneShot);
  if(m) return money(m,o.divisa) + '/mes' + (u ? ' + único' : '');
  if(u) return money(u,o.divisa) + ' único';
  return 'Sin monto';
}
function valorTotal(o){ return num(o.montoOneShot) + num(o.mesRecurrente)*12; }
function campName(id){ const c = DB.campanas.find(x=>x.id===id); return c ? c.titulo : ''; }

/* ════════════════════════ Filtros ════════════════════════ */
function applyFilters(list){
  const q = F.q.trim().toLowerCase();
  return list.filter(o=>{
    if(q && !(`${o.cliente} ${o.nombreOpp} ${o.producto||''} ${o.id} ${o.salesforceId||''} ${o.eecc||''}`.toLowerCase().includes(q))) return false;
    if(F.seg && o.segmento !== F.seg) return false;
    if(F.alta && o.prioridad !== 'Alta') return false;
    if(F.sinMonto && !sinMonto(o)) return false;
    if(F.paso && nextState(o) !== F.paso) return false;
    if(F.eecc && o.eecc !== F.eecc) return false;
    if(F.camp && o.campanaId !== F.camp) return false;
    return true;
  });
}

  return `<div class="filters">
    <label class="search">${svg('search')}<span class="sr">Buscar</span><input type="search" id="fq" placeholder="Buscar cliente, opp o Nº CRM" value="${esc(F.q)}"></label>

    ${DB.campanas.length?`<label><span class="sr">Campaña</span><select class="sel" id="fcamp"><option value="">Todas las campañas</option>${DB.campanas.map(c=>`<option value="${c.id}" ${F.camp===c.id?'selected':''}>${esc(c.titulo)}</option>`).join('')}</select></label>`:''}

}

function parseDMY(s){ if(typeof s==='number'){ const d=XLSX.SSF.parse_date_code(s); return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''; } const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s||'').trim()); return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''; }
function parseMesCierre(s){ const m=/^(\d{1,2})\/(\d{4})$/.exec(String(s||'').trim()); if(!m) return ''; const mes=+m[1], an=+m[2]; return `${an}-${String(mes).padStart(2,'0')}-${String(new Date(an,mes,0).getDate()).padStart(2,'0')}`; }
function parsePct(s){ if(typeof s==='number') return Math.round(s<=1?s*100:s); const n=parseFloat(String(s==null?'':s).replace('%','').replace(',','.')); return isNaN(n)?'':Math.round(n); }
function proveedorDeProducto(p){ p=String(p||'').toLowerCase(); if(p.includes('huawei')) return 'Huawei (HWC)'; if(p.includes('aws')) return 'AWS'; if(p.includes('azure')) return 'Azure'; if(p.includes('google')||p.includes('gcp')) return 'Google Cloud'; if(p.includes('microsoft')||p.includes('365')||p.includes('office')) return 'Microsoft'; if(p.includes('datacenter')||p.includes('servidor')) return 'Personal Cloud (propio)'; return ''; }
// Etapa del portal → etapa del funnel propio (solo al crear; después la etapa es tuya).
function etapaDesdePortal(etapaCRM, prob){
  const e = String(etapaCRM||'').toLowerCase();
  if(e.includes('identific')) return '1-Identificada';
  if(e.includes('propuesta') || e.includes('riesgo') || e.includes('gesti')) return '6-Envío y Negociación';
  const p = Number(prob)||0;
  if(p>=75) return '6-Envío y Negociación'; if(p>=50) return '5-En Pricing/PPCC'; if(p>=25) return '3-En Diseño';
  return '1-Identificada';
}
function esMia(r){
  if(matchMisEecc(r['Ejecutivo'])) return true;
  const resp = normTokens(`${r['Jefe Equipo']||''} ${r['G2 Gerente']||''}`);
  return RESPONSABLES.some(t=>resp.includes(t));
}
function eeccInfo(portalName){
  const e = matchMisEecc(portalName); if(!e) return null;
  return ACCOUNTS.find(a=>a.eecc===e) || null;
}
async function onImportFile(file){
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const name = wb.SheetNames.find(n=>/cotiz/i.test(n)) || wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:'', raw:true});
    if(!rows.length || !('ID Cotización' in rows[0])) { toast('No reconozco el archivo: tiene que ser el export de "Cotizaciones Cloud" del portal.'); return; }
    prepareImport(rows);
    openImport(file.name, rows.length);
  }catch(e){ console.error(e); toast('No se pudo leer el archivo.'); }
}
let IMPORT_META = { meses:6, total:0, mias:0, verViejas:false, file:'' };
function prepareImport(rows){
  IMPORT_META.total = rows.length;
  const mias = rows.filter(esMia);
  IMPORT_META.mias = mias.length;
  const bySf = {}; DB.opps.forEach(o=>{ if(o.salesforceId) bySf[String(o.salesforceId)] = o; });
  const key = r => normalizeCore(r['Cuenta'])+'|'+String(r['Producto']||'').toLowerCase().trim();
  const cnt = {}; mias.forEach(r=>{ cnt[key(r)] = (cnt[key(r)]||0)+1; });
  IMPORT_ROWS = mias.map(r=>{
    const id = String(r['ID Cotización']).trim();
    const existe = bySf[id];
    const mens = num(r['Abono Mensual']), uv = num(r['Cargo Única Vez']);
    return { r, id, existe: existe ? existe.id : '', creada: parseDMY(r['Fecha Creación']),
      sinMonto: !mens && !uv, dup: cnt[key(r)]>1, mens, uv, sel:false };
  }).sort((a,b)=>(b.creada||'').localeCompare(a.creada||''));
  applyCorte();
}
function corteISO(){ const d=new Date(); d.setMonth(d.getMonth()-IMPORT_META.meses); return d.toISOString().slice(0,10); }
function applyCorte(){ const c = corteISO(); IMPORT_ROWS.forEach(x=>{ x.vieja = !x.creada || x.creada < c; x.sel = !x.vieja || !!x.existe; }); }
function openImport(fname){ IMPORT_META.file = fname; renderImport(); $('#modalImport').classList.add('open'); }

    </tbody></table></div>
    <p style="margin:0;font-size:12.5px;color:var(--ink-faint)">Las que ya existen (mismo Nº CRM) solo actualizan los datos del portal: monto, probabilidad, etapa del portal y cierre. Nunca se pisan tu etapa, BANT, bitácora, próximo paso, prioridad ni notas.</p>

  </div>`;

function confirmImport(){
  download(JSON.stringify(DB,null,2), 'backup_backlog_antes_import_' + todayISO() + '.json', 'application/json');
  let nuevas=0, act=0;
  IMPORT_ROWS.filter(x=>x.sel).forEach(x=>{
    const r = x.r;
    const crm = { divisa: r['Divisa']||'USD', probCierre: parsePct(r['Probabilidad']), etapaCRM: r['Etapa'], crmMesCierre: r['Mes Cierre'], crmImportado: todayISO() };
    if(x.existe){
      const o = opp(x.existe); if(!o) return;
      Object.assign(o, crm);
      if(x.mens) o.mesRecurrente = x.mens;
      if(x.uv) o.montoOneShot = x.uv;
      if(!o.fechaEstCierre) o.fechaEstCierre = parseMesCierre(r['Mes Cierre']);
      if(!o.producto) o.producto = r['Producto'];
      act++;
    }else{
      const o = newOpp(Object.assign({
        salesforceId: x.id, cliente: String(r['Cuenta']||'').trim(), nombreOpp: String(r['Producto']||'').split(' / ')[0].trim() || String(r['Nombre Cotización']||''),
        producto: r['Producto'], proveedor: proveedorDeProducto(r['Producto']), mesRecurrente: x.mens, montoOneShot: x.uv,
        etapa: etapaDesdePortal(r['Etapa'], parsePct(r['Probabilidad'])), fechaEntrada: x.creada || todayISO(),
        fechaEstCierre: parseMesCierre(r['Mes Cierre']), origen:'portal', notasTecnicas: r['Nombre Cotización'] ? 'Cotización: ' + r['Nombre Cotización'] : ''
      }, crm));
      const acc = findAccount(o.cliente);
      if(acc) applyAccount(o, acc);
      else { const inf = eeccInfo(r['Ejecutivo']); o.eecc = inf ? inf.eecc : r['Ejecutivo']; if(inf){ o.segmento = inf.segmento; o.ingenieroPreventa = inf.ingenieroPreventa; o.responsableSegmento = inf.responsable; } }
      DB.opps.push(o); nuevas++;
    }
  });
  save(); $('#modalImport').classList.remove('open');
  toast(`Importación lista: ${nuevas} nuevas y ${act} actualizadas. Te bajé un backup de cómo estaba antes.`);
  render();
}

function planillaProd(o){
  const p = `${o.proveedor||''} ${o.producto||''} ${o.nombreOpp||''}`.toLowerCase();
  if(p.includes('workspace')) return 'Google Workspace';
  if(p.includes('aws')) return 'AWS Cloud'; if(p.includes('huawei')) return 'Huawei Cloud'; if(p.includes('azure')) return 'Azure';
  if(p.includes('google')||p.includes('gcp')) return 'Google Cloud';
  if(p.includes('365')||p.includes('microsoft')||p.includes('office')) return 'Microsoft 365';
  if(p.includes('personal cloud')||p.includes('datacenter')||p.includes('servidor')||p.includes('dcv')||p.includes('sspp')) return 'SSPP Cloud';
  return 'Otro';
}
function probPill(p){ const n = Number(p)||0; return n>=90?'90% Alta':n>=70?'75% Media':'50% Baja'; }
function etapaPlanilla(e){ const n = String(e||'').charAt(0); return n==='1'||n==='2'?'Identificación':n==='3'||n==='4'?'Preparación':'Propuesta-Neg.'; }
const usdMens = o => o.divisa==='ARS' ? 0 : num(o.mesRecurrente);
function staffData(){
  const corte = DB.staff.corte || todayISO();
  const mes = corte.slice(0,7);
  const open = DB.opps.filter(isOpen);
  const cerrados = DB.opps.filter(o=>o.estadoFinal==='Ganado' && (o.fechaCierreReal||'').slice(0,7)===mes);
  const pocs = open.filter(o=>o.etapa==='2-POC');
  const acerrar = open.filter(o=>o.etapa!=='2-POC' && (o.etapa==='6-Envío y Negociación' || (o.fechaEstCierre||'').slice(0,7)===mes));
  const pipe = open.filter(o=>o.etapa!=='2-POC' && !acerrar.includes(o));
  const jira = open.filter(o=>String(o.ticketJira||'').trim());
  const desde = new Date(corte); desde.setDate(desde.getDate()-7); const desdeISO = desde.toISOString().slice(0,10);
  const acciones = [];
  DB.opps.forEach(o=>(o.bitacora||[]).forEach(e=>{ const f=(e.fechaHora||'').slice(0,10); if(f>=desdeISO && f<=corte) acciones.push({o,e,key:'acc|'+o.id+'|'+(e.id||e.fechaHora)}); }));
  acciones.sort((a,b)=>(b.e.fechaHora||'').localeCompare(a.e.fechaHora||''));
  const camps = DB.campanas.filter(c=>c.llevarStaff);
  return { corte, cerrados, acerrar, pipe, pocs, jira, acciones, camps };
}

        <label class="fld">Cierre<input type="date" data-cp="fin" value="${esc(c.fin)}"></label>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft)"><span><b style="color:var(--ink)">${st.abiertas}</b> opps abiertas</span><span><b style="color:var(--ink)">${st.ganadas}</b> ganadas</span><span><b style="color:var(--ink)">${money(st.mens)}</b>/mes en pipeline</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px"><h3 style="font-size:15px;font-weight:700">EECC en la campaña</h3>
        <span style="display:flex;gap:8px;flex-wrap:wrap"><label><span class="sr">Sumar EECC</span><select class="sel edit-only" id="cpAddEecc"><option value="">+ Sumar EECC…</option><option value="__todos">Todos mis EECC</option>${disp.map(e=>`<option>${esc(e)}</option>`).join('')}</select></label>
        <button type="button" class="btn sm" data-act="copiarMsg">${svg('copy')}Copiar mensaje para los EECC</button></span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>EECC</th><th class="num">Cuentas objetivo</th><th class="num">Contactadas</th><th class="num">Derivadas a preventa</th><th class="num">Opps abiertas</th><th><span class="sr">Quitar</span></th></tr></thead><tbody>
        ${c.eecc.map((x,i)=>`<tr><td>${esc(x.nombre)}</td>${['objetivo','contactadas','derivadas'].map(k=>`<td class="num"><label><span class="sr">${k}</span><input class="inp" style="width:80px;min-height:32px;padding:4px 8px;text-align:right" inputmode="numeric" data-cpe="${i}|${k}" value="${esc(x[k]||'')}"></label></td>`).join('')}<td class="num">${opps.filter(o=>isOpen(o)&&o.eecc===x.nombre).length}</td><td><button type="button" class="x edit-only" style="border:0;background:transparent;cursor:pointer;color:var(--ink-faint);font-size:16px" data-cpdel="${i}" aria-label="Quitar ${esc(x.nombre)}">×</button></td></tr>`).join('') || '<tr><td colspan="6" style="color:var(--ink-faint);text-align:center;padding:16px">Sumá los EECC que van a mover la campaña.</td></tr>'}
      </tbody></table></div>
      <h3 style="font-size:15px;font-weight:700;margin-top:6px">Ideas y comentarios</h3>
      <div class="edit-only" style="display:flex;gap:8px;align-items:flex-start"><label class="fld" style="flex:1"><span class="sr">Nueva idea</span><textarea id="cpNota" rows="2" placeholder="Volcá ideas sueltas: ángulos, objeciones, qué dijo un EECC, qué salió del staff…"></textarea></label><button type="button" class="btn sm pri" data-act="addNotaCamp">Agregar</button></div>
      ${c.notas.slice().reverse().map(n=>`<div class="box" style="gap:2px"><span style="font-size:12px;color:var(--ink-faint)">${fmtDate(n.fecha)}</span><span style="font-size:14px;white-space:pre-line">${esc(n.texto)}</span></div>`).join('')}
      ${opps.length?`<h3 style="font-size:15px;font-weight:700;margin-top:6px">Oportunidades de la campaña</h3>${opps.map(o=>`<div class="chk" role="button" tabindex="0" data-open="${o.id}"><span class="next ${nextState(o)}">${svg(nextState(o)==='ok'?'chev':'alert',3)}</span><span><b style="font-weight:600">${esc(o.cliente)}</b> · ${esc(o.nombreOpp)}</span><span class="r">${esc(o.estadoFinal==='Abierto'||!o.estadoFinal?etapaLabel(o.etapa):o.estadoFinal)}</span></div>`).join('')}`:'<p style="font-size:12.5px;color:var(--ink-faint);margin:0">Para sumar opps a la campaña, abrí la opp y elegí la campaña en "Más campos".</p>'}
      <div class="edit-only" style="display:flex;justify-content:flex-end"><button type="button" class="btn sm dan" data-act="delCamp">Eliminar campaña</button></div>
    </div></div>`;
  }
  return `<div class="page"><div class="head"><div><div class="crumb">Backlog / Acciones en el territorio</div><h1>Ideas y campañas</h1></div>
    <div class="actions"><span class="sync" id="sync"></span><button type="button" class="btn pri edit-only" data-act="newCamp">${svg('plus',2.4)}Nueva idea</button></div></div>
    <div class="two"><div class="b" style="flex:1 1 380px;max-width:520px"><div class="ideas-board">${cols}</div></div><div class="a">${ficha}</div></div></div>`;
}
function mensajeCampana(c){
  return [`📣 Campaña: ${c.titulo}`, c.disparador&&`¿Por qué ahora? ${c.disparador}`, c.publico&&`A quién apuntamos: ${c.publico}`, c.propuesta&&`Qué gana el cliente: ${c.propuesta}`, c.oferta&&`La oferta: ${c.oferta}`,
    (c.inicio||c.fin)&&`Plazo: ${fmtDate(c.inicio)||'ya'} → ${fmtDate(c.fin)||'a definir'}`, `Si detectás una cuenta que encaja, derivámela y la trabajamos juntos desde preventa cloud.`].filter(Boolean).join('\n');
}

/* ════════════════════════ Render general ════════════════════════ */
function viewHTML(){ return ({tablero:viewTablero, lista:viewLista, pasos:viewPasos, cerradas:viewCerradas, staff:viewStaff, ideas:viewIdeas})[VIEW](); }
function renderMainOnly(){
  const a = document.activeElement; const id = a && a.id; const st = a && a.selectionStart;
  if(_rendering) return;
  if(a && $('#main').contains(a) && (a.tagName==='INPUT'||a.tagName==='TEXTAREA') && a.type!=='checkbox') return; // no pisar lo que estás escribiendo
  $('#main').innerHTML = viewHTML(); renderRail(); setSync(lastSync);
  if(id){ const el = document.getElementById(id); if(el && el!==a){ el.focus(); try{ el.setSelectionRange(st,st); }catch(_){} } }
}
let lastSync = '';
const _setSync = setSync;
setSync = function(t){ lastSync = t; _setSync(t); };
let _rendering = false, _again = false;
function render(){
  if(_rendering){ _again = true; return; }
  _rendering = true;
  try{ doRender(); } finally { _rendering = false; }
  if(_again){ _again = false; setTimeout(render, 0); }
}
function doRender(){
  const a = document.activeElement; const id = a && a.id; let pos = null; try{ pos = a && a.selectionStart; }catch(_){}
  $('#main').innerHTML = viewHTML(); renderRail(); _setSync(lastSync);
  if(id && id!=='fq' ){ const el = document.getElementById(id); if(el) el.focus(); }
  if(id==='fq'){ const el=$('#fq'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } }
  document.body.classList.toggle('ro', isReadonly());
  renderDatalist();
}
function renderDatalist(){ if($('#dlCuentas')) return; const d = document.createElement('datalist'); d.id='dlCuentas'; d.innerHTML = ACCOUNTS.map(a=>`<option value="${esc(a.razonSocial)}">`).join(''); document.body.appendChild(d); }

/* ════════════════════════ Eventos ════════════════════════ */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-view],[data-open],[data-act],[data-fseg],[data-ftog],[data-fpaso],[data-crear-en],[data-bant],[data-cbant],[data-logtipo],[data-dellog],[data-cerrar],[data-sort],[data-camp],[data-cpdel]');
  if(!t) return;
  if(t.dataset.view){ setView(t.dataset.view); return; }
  if(t.dataset.open){ openPanel(t.dataset.open); return; }
  if(t.dataset.fseg!==undefined){ F.seg = t.dataset.fseg; render(); return; }
  if(t.dataset.ftog){ F[t.dataset.ftog] = !F[t.dataset.ftog]; render(); return; }
  if(t.dataset.fpaso){ F.paso = F.paso===t.dataset.fpaso ? '' : t.dataset.fpaso; render(); return; }
  if(t.dataset.crearEn){ openCrear(t.dataset.crearEn); return; }
  if(t.dataset.sort){ LIST_SORT = { k:t.dataset.sort, d: LIST_SORT.k===t.dataset.sort ? -LIST_SORT.d : 1 }; render(); return; }
  if(t.dataset.camp){ SEL_CAMP = t.dataset.camp; render(); return; }
  if(t.dataset.bant){ if(isReadonly()) return; const o = opp(SEL); o[t.dataset.bant] = o[t.dataset.bant]===t.dataset.v ? '' : t.dataset.v; save(); renderPanel(); renderMainOnly(); return; }
  if(t.dataset.cbant){ CREAR[t.dataset.cbant] = CREAR[t.dataset.cbant]===t.dataset.v ? '' : t.dataset.v; renderCrear(); return; }
  if(t.dataset.logtipo){ t.parentElement.querySelectorAll('.pill').forEach(p=>{ p.classList.toggle('on', p===t); p.setAttribute('aria-pressed', p===t); }); return; }
  if(t.dataset.dellog){ const o = opp(SEL); if(!confirm('¿Borrar esta entrada de la bitácora?')) return; o.bitacora = (o.bitacora||[]).filter(x=>(x.id||x.fechaHora)!==t.dataset.dellog); save(); renderPanel(); return; }
  if(t.dataset.cerrar){ const o = opp(SEL); o.estadoFinal = t.dataset.cerrar; if(t.dataset.cerrar!=='Abierto'){ o.fechaCierreReal = o.fechaCierreReal || todayISO(); } save(); renderPanel(); render(); toast(t.dataset.cerrar==='Abierto'?'Oportunidad reabierta':'Marcada como '+t.dataset.cerrar.toLowerCase()); return; }
  if(t.dataset.cpdel){ const c = camp(SEL_CAMP); c.eecc.splice(+t.dataset.cpdel,1); save(); render(); return; }
  const act = t.dataset.act;
  if(act==='crear') openCrear();
  else if(act==='cerrarCrear') $('#modalCrear').classList.remove('open');
  else if(act==='guardarCrear') guardarCrear();
  else if(act==='close') closePanel();
  else if(act==='full'){ PANEL_FULL = !PANEL_FULL; renderPanel(); }
  else if(act==='addlog'){
    const o = opp(SEL); const nota = $('#logNota').value.trim(); if(!nota){ $('#logNota').focus(); return; }
    const tipo = ($('#panel .pill.on')||{}).dataset ? $('#panel .pill.on').dataset.logtipo : 'Nota';
    const fecha = $('#logFecha').value || todayISO();
    (o.bitacora = o.bitacora||[]).push({ id:'L'+Date.now().toString(36), fechaHora: fecha + 'T' + new Date().toTimeString().slice(0,5), tipo, nota });
    save(); renderPanel(); renderMainOnly(); toast('Anotado en la bitácora');
  }
  else if(act==='delopp'){ const o = opp(SEL); if(!confirm(`¿Eliminar "${o.nombreOpp}" de ${o.cliente}? No se puede deshacer.`)) return; DB.opps = DB.opps.filter(x=>x.id!==o.id); save(); closePanel(); toast('Oportunidad eliminada'); }
  else if(act==='import') $('#fileImport').click();
  else if(act==='cerrarImport') $('#modalImport').classList.remove('open');
  else if(act==='impTodas'){ IMPORT_ROWS.filter(x=>!x.vieja||IMPORT_META.verViejas).forEach(x=>x.sel=true); renderImport(); }
  else if(act==='impNinguna'){ IMPORT_ROWS.forEach(x=>x.sel=false); renderImport(); }
  else if(act==='confirmImport') confirmImport();
  else if(act==='backup'){ download(JSON.stringify(DB,null,2), 'backup_backlog_' + todayISO() + '.json', 'application/json'); toast('Backup descargado'); }
  else if(act==='restore') $('#fileBackup').click();
  else if(act==='exportStaff'){ const j = staffJSON(); download(JSON.stringify(j,null,2), 'staff_' + (DB.staff.corte||todayISO()) + '.json', 'application/json'); toast(`JSON listo: ${j.items.cerrado.length} cerrados, ${j.items.acerrar.length} a cerrar, ${j.items.pipe.length} pipeline, ${j.items.poc.length} PoCs, ${j.items.acc.length} acciones.`); }
  else if(act==='newCamp') newCamp();
  else if(act==='delCamp'){ const c = camp(SEL_CAMP); if(!confirm(`¿Eliminar la campaña "${c.titulo}"? Las opps quedan, solo pierden la etiqueta.`)) return; DB.opps.forEach(o=>{ if(o.campanaId===c.id) o.campanaId=''; }); DB.campanas = DB.campanas.filter(x=>x.id!==c.id); SEL_CAMP = null; save(); render(); }
  else if(act==='addNotaCamp'){ const c = camp(SEL_CAMP); const v = $('#cpNota').value.trim(); if(!v) return; c.notas.push({fecha: todayISO(), texto: v}); save(); render(); }
  else if(act==='copiarMsg'){ const txt = mensajeCampana(camp(SEL_CAMP)); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast('Mensaje copiado: pegalo en el mail o chat a los EECC'), ()=>{ prompt('Copiá el mensaje:', txt); }); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='fq'){ F.q = t.value; render(); return; }
  if(t.dataset.f && t.closest('#panel')){ if(t.type==='text'||t.tagName==='TEXTAREA'||t.type==='number'){ const o = opp(SEL); const f=t.dataset.f; if(f==='cliente') return; o[f] = ['mesRecurrente','montoOneShot','margenEstimado','horasInvertidas'].includes(f) ? numInput(t.value) : (f==='probCierre' ? (t.value===''?'':numInput(t.value)) : t.value); save(); clearTimeout(window._rmo); window._rmo = setTimeout(()=>{ renderMainOnlyForce(); }, 400); } return; }
  if(t.dataset.c){ CREAR[t.dataset.c] = t.value; if(t.dataset.c==='cliente'){ $('#cAuto').innerHTML = autoChips(findAccount(t.value), CREAR); } return; }
  if(t.dataset.st){ DB.staff[t.dataset.st] = t.value; save(); return; }
  if(t.dataset.cp && t.type!=='checkbox' && t.tagName!=='SELECT'){ camp(SEL_CAMP)[t.dataset.cp] = t.value; save(); return; }
  if(t.dataset.cpe){ const [i,k] = t.dataset.cpe.split('|'); camp(SEL_CAMP).eecc[+i][k] = t.value; save(); return; }
});
function renderMainOnlyForce(){ if(_rendering) return; const keep = document.activeElement; if(keep && $('#main').contains(keep)) return; $('#main').innerHTML = viewHTML(); renderRail(); _setSync(lastSync); if(keep && document.body.contains(keep)) keep.focus(); }
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.dataset.f && t.closest('#panel')){ onPanelField(t); return; }
  if(t.id==='feecc'){ F.eecc = t.value; render(); return; }
  if(t.id==='fcamp'){ F.camp = t.value; render(); return; }
  if(t.dataset.c){ CREAR[t.dataset.c] = t.value; if(t.dataset.c==='cliente') $('#cAuto').innerHTML = autoChips(findAccount(t.value), CREAR); return; }
  if(t.id==='cOtra'){ CREAR.otra = t.checked; return; }
  if(t.dataset.imp){ const x = IMPORT_ROWS.find(r=>r.id===t.dataset.imp); x.sel = t.checked; renderImport(); return; }
  if(t.id==='impViejas'){ IMPORT_META.verViejas = t.checked; renderImport(); return; }
  if(t.id==='impMeses'){ IMPORT_META.meses = +t.value; applyCorte(); renderImport(); return; }
  if(t.dataset.staff){ t.checked ? STAFF_OFF.delete(t.dataset.staff) : STAFF_OFF.add(t.dataset.staff); render(); return; }
  if(t.dataset.staffacc){ const k = t.dataset.staffacc; STAFF_OFF.delete(k); STAFF_OFF.delete('+'+k); STAFF_OFF.add(t.checked ? '+'+k : k); return; }
  if(t.dataset.st){ DB.staff[t.dataset.st] = t.value; save(); if(t.dataset.st==='corte') render(); return; }
  if(t.dataset.cp){ const c = camp(SEL_CAMP); c[t.dataset.cp] = t.type==='checkbox' ? t.checked : t.value; save(); render(); return; }
  if(t.id==='cpAddEecc' && t.value){ const c = camp(SEL_CAMP); const add = t.value==='__todos' ? MIS_EECC.filter(e=>!c.eecc.some(x=>x.nombre===e)) : [t.value]; add.forEach(n=>c.eecc.push({nombre:n, objetivo:'', contactadas:'', derivadas:''})); save(); render(); return; }
  if(t.id==='fileImport' && t.files[0]){ onImportFile(t.files[0]); t.value=''; return; }
  if(t.id==='fileBackup' && t.files[0]){ const f = t.files[0]; t.value=''; f.text().then(txt=>{ try{ const d = JSON.parse(txt); if(!Array.isArray(d.opps)) throw new Error(); if(!confirm(`¿Reemplazar todo el Backlog nuevo por este backup (${d.opps.length} oportunidades)?`)) return; DB = Object.assign({ opps:[], campanas:[], staff:DB.staff, nextSeq:1, nextCamp:1 }, d); save(); render(); toast('Backup restaurado'); }catch(_){ toast('Ese archivo no es un backup del Backlog nuevo.'); } }); return; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if($('#modalCrear').classList.contains('open')) $('#modalCrear').classList.remove('open'); else if($('#modalImport').classList.contains('open')) $('#modalImport').classList.remove('open'); else if(SEL) closePanel(); }
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.open && e.target.tagName!=='BUTTON'){ openPanel(e.target.dataset.open); }
});
// Arrastrar tarjetas entre etapas
document.addEventListener('dragstart', e=>{ const c = e.target.closest && e.target.closest('.card'); if(c){ e.dataTransfer.setData('text/plain', c.dataset.open); e.dataTransfer.effectAllowed='move'; } });
document.addEventListener('dragover', e=>{ const col = e.target.closest && e.target.closest('.col[data-col]'); if(col){ e.preventDefault(); document.querySelectorAll('.col.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop'); } });
document.addEventListener('dragleave', e=>{ const col = e.target.closest && e.target.closest('.col[data-col]'); if(col && !col.contains(e.relatedTarget)) col.classList.remove('drop'); });
document.addEventListener('drop', e=>{ const col = e.target.closest && e.target.closest('.col[data-col]'); if(!col) return; e.preventDefault(); const o = opp(e.dataTransfer.getData('text/plain')); if(o && o.etapa!==col.dataset.col && !isReadonly()){ o.etapa = col.dataset.col; save(); toast(`${o.cliente} → ${etapaLabel(o.etapa)}`); if(SEL===o.id) renderPanel(); } render(); });

/* ════════════════════════ Arranque ════════════════════════ */
async function boot(){
  if(!DB.staff.nombre && auth.currentUser && auth.currentUser.displayName) DB.staff.nombre = auth.currentUser.displayName;
  render();
  await Promise.all([loadDB(), loadAccounts()]);
  if(!DB.staff.nombre && auth.currentUser && auth.currentUser.displayName) DB.staff.nombre = auth.currentUser.displayName;
  lastSync = 'Sincronizado';
  const d = document.getElementById('dlCuentas'); if(d) d.remove();
  render();
}
$('#btnGoogleLogin').addEventListener('click', async ()=>{
  const provider = new firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({prompt:'select_account'});
  const err = $('#authError'); err.style.display='none';
  try{ await auth.signInWithPopup(provider); }catch(e){ err.textContent = 'No se pudo iniciar sesión: ' + e.message; err.style.display='block'; }
});
auth.onAuthStateChanged(async user=>{
  const gate = $('#authGate'), err = $('#authError');
  if(user && ALLOWED_USERS[user.email]){ CURRENT_ROLE = ALLOWED_USERS[user.email]; gate.style.display='none'; await boot(); }
  else if(user){ err.textContent = 'La cuenta ' + user.email + ' no tiene acceso a este sitio.'; err.style.display='block'; gate.style.display='flex'; await auth.signOut(); }
  else gate.style.display='flex';
});
</script>
